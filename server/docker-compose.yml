services:
  app:
    build: .
    env_file: .env
    ports:
      - "3001:3001"   # ローカルテスト用: ws://localhost:3001/ws/stt
    environment:
      - HF_HOME=/app/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>{if(!r.ok)throw 1})"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s   # モデルロードに時間がかかる

  ngrok:
    image: ngrok/ngrok:latest
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: http app:3001 --url=${NGROK_DOMAIN} --log stdout
    ports:
      - "4040:4040"   # ngrok管理UI: http://localhost:4040
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
